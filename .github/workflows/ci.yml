name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci

      # No lint step: this project has never had eslint installed or configured.
      # typecheck and build are the checks that actually mean something here.
      - run: npm run typecheck
      - run: npm run typecheck:scripts
      - run: npm run build
