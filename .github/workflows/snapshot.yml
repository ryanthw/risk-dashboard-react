name: Daily portfolio snapshot

on:
  schedule:
    # 21:15 UTC on weekdays. That is 17:15 ET during EDT and 16:15 ET during
    # EST, so it lands after the 16:00 ET close in both halves of the year
    # without needing two entries. GitHub's scheduler is best-effort and often
    # runs several minutes late, which is fine — the job only needs to be after
    # the close, and the snapshot is timestamped to a fixed hour regardless.
    - cron: "15 21 * * 1-5"
  # Manual trigger for backfilling a missed day or testing a secret change.
  workflow_dispatch:

# Two runs writing the same day's snapshot would race on the one-per-day check.
concurrency:
  group: portfolio-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Record snapshot
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_EMAIL: ${{ secrets.SUPABASE_EMAIL }}
          SUPABASE_PASSWORD: ${{ secrets.SUPABASE_PASSWORD }}
        run: npm run snapshot
